                            else reject(new Error("Browser gagal membuat file PNG (ukuran terlalu besar?)."));
                        }, "image/png");
                    } catch (err) {
                        gagal(err);
                    }
                };

                img.src = url;
            });
        }

        // Mengunduh PNG. Mengembalikan Promise (boleh di-await, boleh diabaikan).
        // Cara pakai: downloadPNG('nama.png', 3)  atau  downloadPNG('nama.png', { scale: 3, background: 'white' })
        async downloadPNG(filename = 'geometri.png', skalaAtauOpsi = 2) {
            filename = (typeof filename === 'string' && filename.trim()) ? filename.trim() : 'geometri.png';
            if (!/\.png$/i.test(filename)) filename += '.png';

            const opsi = (skalaAtauOpsi && typeof skalaAtauOpsi === 'object')
                ? skalaAtauOpsi
                : { scale: skalaAtauOpsi };

            try {
                const blob = await this.toPNGBlob(opsi);
                this._unduh(blob, filename);
                return blob;
            } catch (err) {
                return this._gagal(`downloadPNG gagal: ${err.message}`);
            }
        }

        // Melepas gambar dari halaman dan membuang isinya. Aman dipanggil berulang kali.
        // Setelah destroy(), instance ini tidak bisa dipakai menggambar lagi; buat instance baru.
        destroy() {
            if (this._destroyed) return;
            this._destroyed = true;

            // Batalkan batch yang sedang berjalan (jika ada)
            this._batch = null;
            this._batchDepth = 0;

            // Lepas SVG dari halaman
            if (this.svg && this.svg.parentNode) {
                this.svg.parentNode.removeChild(this.svg);
            }

            // Hapus dari catatan container
            const daftar = GeoSVG._daftar && GeoSVG._daftar.get(this.container);
            if (daftar) daftar.delete(this);

            // Kosongkan isinya supaya memori bisa dibebaskan walaupun variabel `geo` masih Anda simpan
            this._markers.clear();
            this.svg.textContent = '';
        }

        // Clear the SVG canvas
        clear() {
            // Batalkan batch yang sedang berjalan (jika ada)
            this._batch = null;
            this._batchDepth = 0;

            [...this.svg.children].forEach(child => {
                // Pertahankan defs, judul, deskripsi, dan gambar latar
                if (child === this.defs || child.tagName === 'title' || child.tagName === 'desc'
                    || child === this._layers.latar) return;

                if (Object.values(this._layers).includes(child)) {
                    child.textContent = '';              // lapisan dikosongkan, bukan dihapus
                } else {
                    child.remove();                      // elemen liar yang ditambah manual
                }
            });
        }
    }

    return GeoSVG;
});
</script>

              <h2>2. Label langsung pada garis</h2>
              <p><code>buatSegmen()</code>, <code>buatGaris()</code>, <code>buatSinar()</code>, dan <code>buatVektor()</code> kini menerima opsi <code>label</code>. Fungsi turunannya (<code>buatGarisSejajar</code>, <code>buatGarisTegakLurus</code>, <code>buatSegmenSejajar</code>, <code>buatGarisBagi</code>, garis singgung, dan refleksi) ikut mendapat opsi yang sama karena meneruskan <code>options</code>-nya.</p>
              <pre><code>geo.buatSegmen([40, 150], [260, 150], {
  stroke: '#2563eb',
  label: 'AB = 12 cm',     // teks di samping garis
  labelPosisi: 'tengah',   // 0 s.d. 1, atau 'awal' / 'tengah' / 'akhir'
  labelSisi: 'kanan',      // 'kiri' (bawaan) atau 'kanan'
  labelJarak: 8,           // jarak dari garis (piksel)
  italic: true
});</code></pre>

              <h2>3. Garis singgung dan refleksi</h2>
              <pre><code>const L = { pusat: [100, 110], r: 50 };

// Dua garis singgung dari P ke lingkaran, berikut titik singgungnya
geo.buatGarisSinggung(L, [260, 110], {
  bentuk: 'segmen', titikSinggung: true, labelTitik: ['A', 'B']
});

// Garis singgung persekutuan luar dan dalam dua lingkaran
geo.buatGarisSinggungPersekutuan(L, { pusat: [230, 110], r: 30 }, { jenis: 'semua' });

// Bayangan segitiga terhadap garis cermin, dengan garis penghubung
geo.buatRefleksi([[50, 70], [120, 70], [85, 160]], [[160, 0], [160, 200]], {
  fill: '#fee2e2', titik: true, labelTitik: ["A'", "B'", "C'"], penghubung: true
});</code></pre>
              <p>Semua method <code>hitung...</code> mengembalikan koordinat murni tanpa menggambar, sehingga hasilnya bisa dipakai untuk konstruksi lanjutan.</p>

              <h2>4. Gambar latar</h2>
              <pre><code>// Dari input file, URL (harus mengizinkan CORS), atau data URL
await geo.setGambarLatar(input.files[0], { fit: 'cover', maksSisi: 1600, opacity: 0.8 });
geo.hapusGambarLatar();</code></pre>
              <p>Gambar disimpan sebagai data URL di lapisan <code>latar</code> (paling bawah, di bawah grid), sehingga <strong>ikut tersimpan</strong> pada hasil <code>downloadSVG()</code> dan <code>downloadPNG()</code>. Metode <code>clear()</code> tidak menghapus gambar latar.</p>

              <h2>5. Font global dan gaya teks</h2>
              <pre><code>const geo = new GeoSVG('wadah', 400, 300, {
  fontFamily: 'Georgia, serif',   // BARU: font bawaan untuk semua teks
  fontSize: '14px'                // BARU
});
geo.buatTeks(200, 150, 'Teks miring', { fontStyle: 'italic', fontWeight: 'bold' });</code></pre>
              <p>Opsi <code>fontStyle</code> ('italic' / 'oblique' / 'normal') kini didukung di <code>buatTeks()</code>, label titik, label sudut, dan label garis. Label titik, label garis, dan label dimensi mengikuti font bawaan gambar jika tidak diatur sendiri.</p>

              <h2>6. Persegi panjang dengan sudut membulat</h2>
              <pre><code>geo.buatPersegiPanjang([40, 40], 200, 100, { radius: 16 });
geo.buatPersegi([40, 160], 80, { radius: 'penuh' });   // sudut membulat penuh</code></pre>
              <p>Opsi <code>radius</code> (alias <code>jariJari</code>) otomatis dibatasi setengah sisi terpendek.</p>

              <h2>7. Penyempurnaan lain</h2>
              <ul style="margin-left:1.25rem;margin-bottom:1rem;color:var(--text-secondary);">
                <li><code>buatDimensi()</code>: label selalu berada di sisi luar garis dimensi, ada opsi <code>labelJarak</code>, <code>fontFamily</code>, <code>fontWeight</code>, <code>fontStyle</code>, serta pemeriksaan <code>offset</code> dan titik yang sama.</li>
                <li><code>buatVektor()</code>: warna kepala panah mengikuti <code>defaultStroke</code> bila <code>stroke</code> tidak diisi.</li>
                <li><code>buatLatex()</code>: opsi <code>opacity</code> untuk rumus.</li>
                <li><code>clear()</code>: gambar latar tetap dipertahankan.</li>
              </ul>

              <h2 id="kompatibilitas">8. Perubahan perilaku & kompatibilitas</h2>
              <div class="beta-callout">
                <strong>⚠️ Garis berlabel mengembalikan <code>&lt;g&gt;</code>.</strong><br>
                Tanpa opsi <code>label</code>, <code>buatSegmen()</code>, <code>buatGaris()</code>, <code>buatSinar()</code>, dan <code>buatVektor()</code> tetap mengembalikan elemen <code>&lt;line&gt;</code> seperti sebelumnya. Dengan <code>label</code>, hasilnya adalah <code>&lt;g&gt;</code> berisi garis dan teks. Jika kode Anda mengubah atribut hasilnya (mis. <code>setAttribute('stroke', ...)</code>), ambil garisnya dengan <code>hasil.querySelector('line')</code>.
              </div>
              <div class="beta-callout">
                <strong>⚠️ <code>bold: true</code> tidak lagi berlaku pada <code>buatTeks()</code>.</strong><br>
                Pada v0.0.4, <code>buatTeks()</code> (dan fungsi yang meneruskan opsinya ke <code>buatTeks()</code>, yaitu <code>buatLabelSisi()</code> dan <code>buatLabelSisiPoligon()</code>) hanya membaca <code>fontWeight</code>. Gunakan <code>fontWeight: 'bold'</code>. Opsi <code>bold</code> tetap berfungsi pada label titik, label sudut/siku, dan label garis.
              </div>
              <div class="info-callout">
                <strong>ℹ️ Perubahan kecil lainnya.</strong>
                <ul style="margin-left:1.25rem;margin-top:0.35rem;">
                  <li><code>buatDimensi()</code>: posisi label kini mengikuti tanda <code>offset</code> (selalu di luar garis dimensi), dan titik yang sama menghasilkan peringatan (atau Error pada mode <code>strict</code>) alih-alih mengembalikan <code>null</code> diam-diam.</li>
                  <li><code>buatVektor()</code>: opsi <code>label</code> tidak lagi diteruskan ke <code>buatSegmen()</code>; label dipasang setelah kepala panah terpasang.</li>
                </ul>
              </div>

              <h2>9. Cara memperbarui dari v0.0.3</h2>

              try {
                // 1. Garis singgung
                const g1 = new GeoSVG(a, 260, 180, { clearContainer: true, title: 'Dua garis singgung dari titik P ke lingkaran', background: '#ffffff' });
                const L = { pusat: [85, 90], r: 45 }, P = [235, 90];
                g1.buatLingkaran(L.pusat, L.r, { stroke: '#475569', fill: '#f1f5f9' });

                g2.buatRefleksi(segitiga, cermin, { fill: '#fee2e2', stroke: '#dc2626', strokeWidth: 2, penghubung: true });

                // 3. Sinar dan label garis
                const g3 = new GeoSVG(c, 260, 180, { clearContainer: true, title: 'Sinar OA dan ruas OB dengan label', background: '#ffffff', fontFamily: 'Georgia, serif', fontSize: '13px' });

                g3.buatTitik(O, { label: 'O', labelPosition: 'kiri bawah' });
              } catch (err) {
                console.warn('Gagal menampilkan contoh ringkas:', err);
              }
            }

await geo.setGambarLatar(k.toDataURL('image/png'), { fit: 'cover' });

// Menggambar bangun geometri di atas gambar latar
geo.buatSegitiga([70, 150], [170, 150], [120, 85], {
  fill: 'rgba(255, 255, 255, 0.7)', stroke: '#b91c1c', strokeWidth: 2
});
geo.buatPersegiPanjang([85, 150], 70, 30, { fill: 'rgba(255,255,255,0.7)', stroke: '#b91c1c', strokeWidth: 2 });

// Hapus gambar latar setelah 2 detik
setTimeout(() => geo.hapusGambarLatar(), 2000);
return 'Gambar latar terpasang, lalu dihapus otomatis setelah 2 detik.';`
          },
          {
            id: "keStringSVG",
            nama: "keStringSVG() & downloadSVG()",
            ringkasan: "Mengekspor gambar kanvas menjadi string kode XML SVG murni atau langsung mengunduhnya sebagai file .svg.",
            sintaks: `const xmlString = geo.keStringSVG();\ngeo.downloadSVG('nama-file.svg');`,
            parameter: [
              { nama: "filename", tipe: "string", ket: "Nama file saat diunduh (bawaan: 'geometri.svg')." }
            ],
            opsi: [],
            contohKode: `const geo = new GeoSVG(container, 320, 190);
geo.buatPoligonBeraturan([160, 95], 65, 5, { fill: '#dbeafe', stroke: '#2563eb', strokeWidth: 2 });

const xml = geo.keStringSVG();
return 'Panjang karakter XML SVG: ' + xml.length + ' karakter. Panggil geo.downloadSVG() untuk mengunduh.';`
          },
          {
            id: "downloadPNG",
            nama: "toPNGBlob() & downloadPNG()",
            ringkasan: "Mengonversi kanvas SVG menjadi gambar raster PNG beresolusi tajam (Promise<Blob>) atau langsung mengunduhnya sebagai file .png.",
            sintaks: `await geo.downloadPNG('geometri.png', { scale: 3, background: 'white' });\nconst blob = await geo.toPNGBlob({ scale: 2 });`,
            parameter: [
              { nama: "filename", tipe: "string", ket: "Nama file PNG (bawaan: 'geometri.png')." },
              { nama: "skalaAtauOpsi", tipe: "number | Object", ket: "Angka pembesaran resolusi (bawaan: 2) atau objek opsi." }
            ],
            opsi: [
              { nama: "scale", tipe: "number", bawaan: "2", ket: "Faktor pengali resolusi piksel gambar PNG." },
              { nama: "background", tipe: "string", bawaan: "latar SVG", ket: "Warna latar belakang PNG (mis. '#ffffff' atau 'transparent')." },
              { nama: "tanpaLatex", tipe: "boolean", bawaan: "false", ket: "Jika true, mengabaikan elemen LaTeX agar ekspor PNG tidak diblokir keamanan canvas browser." }
            ],
            contohKode: `const geo = new GeoSVG(container, 320, 190, { background: '#ffffff' });
geo.buatLingkaran([160, 95], 65, { fill: '#fef08a', stroke: '#ca8a04', strokeWidth: 2 });
geo.buatTeks(160, 95, 'Siap Ekspor PNG', { position: 'tengah', fontWeight: 'bold' });

return 'Gunakan geo.downloadPNG("gambar.png", 3) untuk mengunduh gambar PNG 3x lipat lebih tajam.';`
          },
          {
            id: "clear",
            nama: "clear() & destroy()",
            diperbarui: "clear() kini mempertahankan gambar latar yang dipasang dengan setGambarLatar().",
            ringkasan: "clear() mengosongkan seluruh gambar tanpa menghapus kanvas SVG, sedangkan destroy() melepas elemen SVG dari halaman dan membebaskan memori. Gambar latar (setGambarLatar) tidak ikut terhapus oleh clear().",
            sintaks: `geo.clear()   // Mengosongkan isi lapisan, siap digambar ulang\ngeo.destroy() // Menghapus kanvas SVG dari container secara permanen`,
            parameter: [],
            opsi: [],
            contohKode: `const geo = new GeoSVG(container, 320, 190);
geo.buatLingkaran([160, 95], 70, { fill: '#fca5a5' });

// Bersihkan kanvas lalu gambar objek baru
geo.clear();
geo.buatGrid(25);
geo.buatPersegi([105, 40], 110, { fill: '#bbf7d0', stroke: '#16a34a', strokeWidth: 2 });
geo.buatTeks(160, 95, 'Digambar setelah clear()', { position: 'tengah', fontWeight: 'bold' });`
          }
        ]
      }
    ];

    // =========================================================================
    // LOGIKA APLIKASI DOKUMENTASI (NAVIGASI, PENCARIAN, & LIVE RUNNER)
    // =========================================================================
    const sidebar = document.getElementById('sidebar');
    const sidebarNav = document.getElementById('sidebarNav');
    const mainContent = document.getElementById('mainContent');
    const searchInput = document.getElementById('searchInput');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const AsyncFunction = Object.getPrototypeOf(async function () { }).constructor;

    // Mengamankan teks dari data agar tanda < > & tampil apa adanya (mis. "Array<string>")
    const esc = s => String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // Lencana BARU / UPDATE untuk fungsi dan halaman
    const lencana = o => o.baru
      ? '<span class="badge badge-baru">BARU</span>'
      : (o.diperbarui ? '<span class="badge badge-upd">UPDATE</span>' : '');

    // Ringkasan di bawah logo (dihitung otomatis dari data)
    (function isiRingkasanBrand() {
      const jumlahKategori = DOCS_DATA.filter(k => k.id !== 'memulai').length;
      const jumlahFungsi = DOCS_DATA.reduce((n, k) => n + (k.fungsi || []).length, 0);
      const el = document.getElementById('brandSub');
      if (el) el.textContent = `Dokumentasi Resmi • ${jumlahKategori} Kategori • ${jumlahFungsi} Halaman Fungsi`;
    })();

    mobileMenuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // Daftar rata semua rute untuk tombol "Sebelumnya / Berikutnya"
    function dapatkanSemuaRute() {
      const urut = [];
      DOCS_DATA.forEach(kat => {
        (kat.halamanKhusus || []).forEach(h => {
          urut.push({ route: h.id, label: h.nama });
        });
        urut.push({ route: `kategori/${kat.id}`, label: `Kategori: ${kat.judul}` });
        (kat.fungsi || []).forEach(f => {
          urut.push({ route: `fungsi/${f.id}`, label: f.nama });
        });
      });
      return urut;
    }

    function cocokFungsi(f, q) {
      return f.nama.toLowerCase().includes(q)
        || f.ringkasan.toLowerCase().includes(q)
        || (q === 'baru' && !!f.baru)
        || ((q === 'update' || q === 'diperbarui') && !!f.diperbarui);
    }

    function renderSidebar(filter = '') {
      const q = filter.trim().toLowerCase();
      let html = '';

      DOCS_DATA.forEach(kat => {
        const halamanKhususCocok = (kat.halamanKhusus || []).filter(h =>
          h.nama.toLowerCase().includes(q) || (q === 'baru' && !!h.baru)
        );
        const fungsiCocok = (kat.fungsi || []).filter(f => cocokFungsi(f, q));

        const kategoriCocok = kat.judul.toLowerCase().includes(q);
        if (q && !kategoriCocok && halamanKhususCocok.length === 0 && fungsiCocok.length === 0) {
          return;
        }

        const daftarFungsiTampil = kategoriCocok ? (kat.fungsi || []) : fungsiCocok;
        const daftarKhususTampil = kategoriCocok ? (kat.halamanKhusus || []) : halamanKhususCocok;

        html += `
          <div class="nav-group">
            <a href="#kategori/${kat.id}" class="nav-cat-link" data-route="kategori/${kat.id}">
              <span>${esc(kat.judul)}</span>
              <span class="cat-count">${(kat.fungsi || []).length}</span>
            </a>
            <ul class="nav-items">
        `;

        daftarKhususTampil.forEach(h => {
          html += `<li class="nav-item"><a href="#${h.id}" class="text-link" data-route="${h.id}"><span class="nav-label">📖 ${esc(h.nama)}</span>${lencana(h)}</a></li>`;
        });

        daftarFungsiTampil.forEach(f => {
          html += `<li class="nav-item"><a href="#fungsi/${f.id}" data-route="fungsi/${f.id}"><span class="nav-label">${esc(f.nama)}</span>${lencana(f)}</a></li>`;
        });

        html += `</ul></div>`;
      });

      sidebarNav.innerHTML = html || `<p style="padding:0.5rem;font-size:0.85rem;">Tidak ada fungsi yang cocok.</p>`;
      tandaiMenuAktif();
    }

    function tandaiMenuAktif() {
      const hash = location.hash.slice(1) || 'pengenalan';
      document.querySelectorAll('.sidebar a[data-route]').forEach(a => {
        a.classList.toggle('active', a.getAttribute('data-route') === hash);
      });
    }

    function buatNavigasiBawah(currentRoute) {
      const semua = dapatkanSemuaRute();
      const idx = semua.findIndex(r => r.route === currentRoute);
      if (idx === -1) return '';

      const prev = idx > 0 ? semua[idx - 1] : null;
      const next = idx < semua.length - 1 ? semua[idx + 1] : null;

      return `
        <div class="page-nav">
          ${prev ? `<a href="#${prev.route}"><span>← Sebelumnya</span><strong>${esc(prev.label)}</strong></a>` : `<div></div>`}
          ${next ? `<a href="#${next.route}" style="text-align:right;"><span>Berikutnya →</span><strong>${esc(next.label)}</strong></a>` : `<div></div>`}
        </div>
      `;
    }

    function renderHalaman() {
      const hash = location.hash.slice(1) || 'pengenalan';
      sidebar.classList.remove('open');
      tandaiMenuAktif();

      // 1. Cek Halaman Khusus
      for (const kat of DOCS_DATA) {
        for (const h of (kat.halamanKhusus || [])) {
          if (h.id === hash) {
            mainContent.innerHTML = h.kontenHTML + buatNavigasiBawah(hash);
            // Tautan loncat ke bagian dalam halaman yang sama (data-lompat="id-elemen")
            mainContent.querySelectorAll('[data-lompat]').forEach(a => {
              a.addEventListener('click', e => {
                e.preventDefault();
                const target = document.getElementById(a.getAttribute('data-lompat'));
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
              });
            });
            renderMathHalaman(mainContent);
            window.scrollTo(0, 0);
            if (typeof h.setelahRender === 'function') h.setelahRender();
            return;
          }
        }
      }

      // 2. Cek Halaman Kategori (#kategori/...)
      if (hash.startsWith('kategori/')) {
        const katId = hash.split('/')[1];
        const kat = DOCS_DATA.find(k => k.id === katId);
        if (kat) {
          const specialCards = (kat.halamanKhusus || []).map(h => `
            <a href="#${h.id}" class="fn-card">
              <div>
                <h3 style="font-family:inherit;">📖 ${esc(h.nama)}${lencana(h)}</h3>
                <p>${esc(h.ringkas || 'Panduan pengantar dan cara instalasi dasar GeoSVG.js.')}</p>
              </div>
            </a>
          `).join('');

          const fnCards = (kat.fungsi || []).map(f => `
            <a href="#fungsi/${f.id}" class="fn-card">
              <div>
                <h3>${esc(f.nama)}${lencana(f)}</h3>
                <p>${esc(f.ringkasan)}</p>
              </div>
            </a>
          `).join('');

          mainContent.innerHTML = `
            <a href="#pengenalan" class="breadcrumb">📚 Dokumentasi GeoSVG.js</a>
            <h1>${esc(kat.judul)}</h1>
            <p class="lead">${esc(kat.deskripsi)}</p>

            <h2>Daftar Halaman & Fungsi (${(kat.fungsi || []).length} Fungsi)</h2>
            <div class="card-grid">
              ${specialCards}
              ${fnCards}
            </div>
            ${buatNavigasiBawah(hash)}
          `;
          renderMathHalaman(mainContent);
          window.scrollTo(0, 0);
          return;
        }
      }

      // 3. Cek Halaman Detail Fungsi (#fungsi/...)
      if (hash.startsWith('fungsi/')) {
        const fnId = hash.split('/')[1];
        for (const kat of DOCS_DATA) {
          const fn = (kat.fungsi || []).find(f => f.id === fnId);
          if (fn) {
            tampilkanHalamanFungsi(kat, fn, hash);
            renderMathHalaman(mainContent);
            window.scrollTo(0, 0);
            return;
          }
        }
      }

      location.hash = '#pengenalan';
    }

    function tampilkanHalamanFungsi(kat, fn, hash) {
      const barisParam = (fn.parameter && fn.parameter.length > 0)
        ? fn.parameter.map(p => `
            <tr>
              <td><code>${esc(p.nama)}</code></td>
              <td><code>${esc(p.tipe)}</code></td>
              <td>${esc(p.ket)}</td>
            </tr>
          `).join('')
        : `<tr><td colspan="3" style="color:var(--text-muted);">Fungsi ini tidak memerlukan parameter wajib.</td></tr>`;

      const bagianOpsi = (fn.opsi && fn.opsi.length > 0)
        ? `
          <h2>Opsi Konfigurasi (<code>options</code>)</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Nama Opsi</th><th>Tipe</th><th>Nilai Bawaan</th><th>Keterangan</th></tr>
              </thead>
              <tbody>
                ${fn.opsi.map(o => `
                  <tr>
                    <td><code>${esc(o.nama)}</code></td>
                    <td><code>${esc(o.tipe)}</code></td>
                    <td><code>${esc(o.bawaan)}</code></td>
                    <td>${esc(o.ket)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `
        : '';

      const bagianKembalian = fn.kembalian
        ? `<h2>Nilai Kembalian</h2><p>${esc(fn.kembalian)}</p>`
        : '';

      const bagianCatatan = fn.catatan
        ? `<div class="info-callout"><strong>📝 Catatan:</strong> ${fn.catatan}</div>`
        : '';

      const kotakVersi = fn.baru
        ? `<div class="baru-callout"><strong>🆕 Baru di v0.0.4.</strong> Fungsi ini belum tersedia di v0.0.3.</div>`
        : (fn.diperbarui
          ? `<div class="upd-callout"><strong>✨ Diperbarui di v0.0.4.</strong> ${esc(fn.diperbarui)} <a href="#apa-yang-baru">Lihat selengkapnya</a></div>`
          : '');

      mainContent.innerHTML = `
        <a href="#kategori/${kat.id}" class="breadcrumb">← Kategori: ${esc(kat.judul)}</a>
        <h1><code>${esc(fn.nama)}</code>${lencana(fn)}</h1>
        <p class="lead">${esc(fn.ringkasan)}</p>
        ${kotakVersi}

        <h2>Format Kode (Sintaks)</h2>
        <pre><code>${esc(fn.sintaks)}</code></pre>

        <h2>Parameter</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Parameter</th><th>Tipe</th><th>Keterangan</th></tr>
            </thead>
            <tbody>${barisParam}</tbody>
          </table>
        </div>

        ${bagianOpsi}
        ${bagianKembalian}
        ${bagianCatatan}

        <h2>Contoh & Hasil Contoh Interaktif</h2>
        <p>Anda dapat mengubah kode di sebelah kiri dan menekan <strong>Jalankan Kode</strong> untuk melihat perubahan hasilnya secara langsung. Kode boleh memakai <code>await</code>.</p>
        <div class="demo-container">
          <div class="code-editor-panel">
            <div class="panel-toolbar">
              <span>KODE CONTOH JAVASCRIPT</span>
              <div class="toolbar-actions">
                <button class="btn-small" id="btnCopyCode">Salin Kode</button>
                <button class="btn-small" id="btnResetCode">Reset</button>
                <button class="btn-small primary" id="btnRunCode">▶ Jalankan Kode</button>
              </div>
            </div>
            <textarea id="liveCodeEditor" class="code-textarea" spellcheck="false"></textarea>
          </div>

          <div class="preview-panel">
            <div class="preview-header">
              <span>HASIL CONTOH (LIVE SVG)</span>
              <button class="btn-small" id="btnDownloadDemoSVG" style="background:#e2e8f0;color:#0f172a;">Unduh SVG</button>
            </div>
            <div class="preview-canvas">
              <div id="livePreviewContainer"></div>
              <div id="liveConsoleOutput" class="console-output" style="display:none;"></div>
            </div>
          </div>
        </div>

        ${buatNavigasiBawah(hash)}
      `;

      const editor = document.getElementById('liveCodeEditor');
      const previewContainer = document.getElementById('livePreviewContainer');
      const consoleBox = document.getElementById('liveConsoleOutput');
      editor.value = fn.contohKode;
      let nomorJalan = 0;

      async function jalankanKode() {
        const saya = ++nomorJalan;

        // Hancurkan gambar GeoSVG sebelumnya di wadah ini agar tidak muncul peringatan "bertumpuk"
        const lama = GeoSVG._daftar && GeoSVG._daftar.get(previewContainer);
        if (lama) [...lama].forEach(g => g.destroy());

        previewContainer.innerHTML = '';
        consoleBox.style.display = 'none';
        consoleBox.style.color = '';
        try {
          const runner = new AsyncFunction('container', editor.value);
          const hasilReturn = await runner(previewContainer);
          if (saya !== nomorJalan) return;
          if (hasilReturn !== undefined) {
            consoleBox.style.display = 'block';
            consoleBox.textContent = '💡 Output: ' + hasilReturn;
          }
        } catch (err) {
          if (saya !== nomorJalan) return;
          consoleBox.style.display = 'block';
          consoleBox.style.color = '#dc2626';
          consoleBox.textContent = '⚠️ Error: ' + err.message;
        }
      }

      document.getElementById('btnRunCode').addEventListener('click', jalankanKode);
      document.getElementById('btnResetCode').addEventListener('click', () => {
        editor.value = fn.contohKode;
        jalankanKode();
      });
      document.getElementById('btnCopyCode').addEventListener('click', (e) => {
        navigator.clipboard.writeText(editor.value);
        e.target.textContent = '✓ Tersalin!';
        setTimeout(() => { e.target.textContent = 'Salin Kode'; }, 1500);
      });
      document.getElementById('btnDownloadDemoSVG').addEventListener('click', () => {
        const svgEl = previewContainer.querySelector('svg');
        if (!svgEl) return;
        const xml = '<?xml version="1.0" standalone="no"?>\r\n' + new XMLSerializer().serializeToString(svgEl);
        const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `contoh-${fn.id}.svg`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

      jalankanKode();
    }

    searchInput.addEventListener('input', e => renderSidebar(e.target.value));
    window.addEventListener('hashchange', renderHalaman);

    // Inisialisasi saat halaman pertama kali dibuka
    renderSidebar();
    renderHalaman();
  </script>
</body>

</html>
