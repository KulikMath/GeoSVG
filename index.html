<html lang="id">

  <style>
    :root {
      --bg-body: #ffffff;
      --bg-sidebar: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --code-bg: #0f172a;
      --code-text: #f8fafc;
      --accent-green: #16a34a;
      --accent-amber: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background: var(--bg-body);
      display: flex;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ================= SIDEBAR KIRI ================= */
    .sidebar {
      width: 310px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      user-select: none;
    }

    .sidebar-header {
      padding: 1.25rem 1rem 0.9rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-sidebar);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
    }

    .search-wrapper {
      position: relative;
    }

    .search-box {
      width: 100%;
      padding: 0.55rem 0.75rem 0.55rem 2.1rem;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.86rem;
      background: #fff;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-box:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .sidebar-nav {
      padding: 1rem 0.85rem 2rem;
      flex: 1;
    }

    .nav-group {
      margin-bottom: 1.15rem;
    }

    .nav-cat-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.4rem 0.55rem;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }

    .nav-cat-link:hover,
    .nav-cat-link.active {
      color: var(--primary);
      background: var(--primary-light);
    }

    .cat-count {
      background: #e2e8f0;
      color: var(--text-secondary);
      font-size: 0.68rem;
      padding: 0.05rem 0.42rem;
      border-radius: 99px;
      font-weight: 600;
    }

    .nav-items {
      list-style: none;
      margin-top: 0.2rem;
      padding-left: 0.45rem;
      border-left: 2px solid var(--border);
      margin-left: 0.55rem;
    }

    .nav-item a {
      display: block;
      padding: 0.28rem 0.6rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.84rem;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      transition: all 0.12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item a.text-link {
      font-family: inherit;
      font-weight: 500;
    }

    .nav-item a:hover {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .nav-item a.active {
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
    }

    /* ================= AREA KONTEN UTAMA ================= */
    .main-wrapper {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar-mobile {
      display: none;
      padding: 0.85rem 1.25rem;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .menu-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }

    .content {
      padding: 2.5rem 3.25rem 4rem;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
    }

    .breadcrumb {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--primary-light);
      color: var(--primary);
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.85rem;
      text-decoration: none;
    }

    .breadcrumb:hover {
      background: #dbeafe;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
      color: var(--text-main);
    }

    .lead {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 2.2rem 0 0.85rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 1.25rem 0 0.5rem;
    }

    p {
      margin-bottom: 0.9rem;
      color: var(--text-secondary);
    }

    /* BLOK KODE & TABEL */
    pre {
      background: var(--code-bg);
      color: var(--code-text);
      padding: 1rem 1.2rem;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.86rem;
      margin-bottom: 1.25rem;
      line-height: 1.55;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border: 1px solid #1e293b;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: var(--bg-subtle);
      color: #be185d;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.86em;
    }

    pre code {
      background: none;
      color: inherit;
      padding: 0;
      font-size: inherit;
    }

    .table-wrap {
      overflow-x: auto;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th,
    td {
      text-align: left;
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: none;
    }

    th {
      background: var(--bg-sidebar);
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
    }

    /* KOTAK CONTOH INTERAKTIF & HASIL CONTOH */
    .demo-container {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1.25rem;
      align-items: stretch;
      margin-top: 0.75rem;
    }

    .code-editor-panel {
      display: flex;
      flex-direction: column;
      background: var(--code-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    .panel-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.55rem 0.9rem;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .toolbar-actions {
      display: flex;
      gap: 0.45rem;
    }

    .btn-small {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 0.28rem 0.65rem;
      border-radius: 5px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-small:hover {
      background: #475569;
    }

    .btn-small.primary {
      background: var(--primary);
    }

    .btn-small.primary:hover {
      background: var(--primary-hover);
    }

    .code-textarea {
      width: 100%;
      flex: 1;
      min-height: 250px;
      background: var(--code-bg);
      color: #e2e8f0;
      border: none;
      padding: 0.95rem 1.1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.84rem;
      line-height: 1.55;
      resize: vertical;
      outline: none;
    }

    .preview-panel {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    .preview-header {
      padding: 0.55rem 0.9rem;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      min-height: 250px;
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .console-output {
      width: 100%;
      margin-top: 0.65rem;
      padding: 0.55rem 0.75rem;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      color: #0f172a;
    }

    /* KARTU KATEGORI & FUNGSI */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .fn-card {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 1.1rem;
      text-decoration: none;
      color: inherit;
      background: var(--bg-card);
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .fn-card:hover {
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.08);
      transform: translateY(-2px);
    }

    .fn-card h3 {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--primary);
      font-size: 0.98rem;
      margin: 0 0 0.4rem 0;
    }

    .fn-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
    }

    .info-callout {
      background: var(--primary-light);
      border-left: 4px solid var(--primary);
      padding: 0.9rem 1.1rem;
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      color: #1e3a8a;
    }

    .page-nav {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .page-nav a {
      text-decoration: none;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.88rem;
      transition: border-color 0.15s, background 0.15s;
      max-width: 48%;
    }

    .page-nav a:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .page-nav span {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.15rem;
    }

    @media (max-width: 960px) {
      .demo-container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 780px) {
      body {
        flex-direction: column;
      }

      .topbar-mobile {
        display: flex;
      }

      .sidebar {
        position: fixed;
        left: -320px;
        top: 0;
        bottom: 0;
        z-index: 50;
        transition: left 0.25s ease;
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
      }

      .sidebar.open {
        left: 0;
      }

      .content {
        padding: 1.5rem 1.25rem 3rem;
      }
    }
  </style>
</head>

    // =========================================================================
    // LOGIKA APLIKASI DOKUMENTASI (NAVIGASI, PENCARIAN, & LIVE RUNNER)
    // =========================================================================
    const sidebar = document.getElementById('sidebar');
    const sidebarNav = document.getElementById('sidebarNav');
    const mainContent = document.getElementById('mainContent');
    const searchInput = document.getElementById('searchInput');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');

    mobileMenuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // Buat daftar rata semua rute untuk tombol "Sebelumnya / Berikutnya"
    function dapatkanSemuaRute() {
      const urut = [];
      DOCS_DATA.forEach(kat => {
        (kat.halamanKhusus || []).forEach(h => {
          urut.push({ route: h.id, label: h.nama });
        });
        urut.push({ route: `kategori/${kat.id}`, label: `Kategori: ${kat.judul}` });
        (kat.fungsi || []).forEach(f => {
          urut.push({ route: `fungsi/${f.id}`, label: f.nama });
        });
      });
      return urut;
    }

    function renderSidebar(filter = '') {
      const q = filter.trim().toLowerCase();
      let html = '';

      DOCS_DATA.forEach(kat => {
        const halamanKhususCocok = (kat.halamanKhusus || []).filter(h =>
          h.nama.toLowerCase().includes(q)
        );
        const fungsiCocok = (kat.fungsi || []).filter(f =>
          f.nama.toLowerCase().includes(q) || f.ringkasan.toLowerCase().includes(q)
        );

        const kategoriCocok = kat.judul.toLowerCase().includes(q);
        if (q && !kategoriCocok && halamanKhususCocok.length === 0 && fungsiCocok.length === 0) {
          return;
        }

        const daftarFungsiTampil = kategoriCocok ? (kat.fungsi || []) : fungsiCocok;
        const daftarKhususTampil = kategoriCocok ? (kat.halamanKhusus || []) : halamanKhususCocok;

        html += `
          <div class="nav-group">
            <a href="#kategori/${kat.id}" class="nav-cat-link" data-route="kategori/${kat.id}">
              <span>${kat.judul}</span>
              <span class="cat-count">${(kat.fungsi || []).length}</span>
            </a>
            <ul class="nav-items">
        `;

        daftarKhususTampil.forEach(h => {
          html += `<li class="nav-item"><a href="#${h.id}" class="text-link" data-route="${h.id}">📖 ${h.nama}</a></li>`;
        });

        daftarFungsiTampil.forEach(f => {
          html += `<li class="nav-item"><a href="#fungsi/${f.id}" data-route="fungsi/${f.id}">${f.nama}</a></li>`;
        });

        html += `</ul></div>`;
      });

      sidebarNav.innerHTML = html || `<p style="padding:0.5rem;font-size:0.85rem;">Tidak ada fungsi yang cocok.</p>`;
      tandaiMenuAktif();
    }

    function tandaiMenuAktif() {
      const hash = location.hash.slice(1) || 'pengenalan';
      document.querySelectorAll('.sidebar a[data-route]').forEach(a => {
        a.classList.toggle('active', a.getAttribute('data-route') === hash);
      });
    }

    function buatNavigasiBawah(currentRoute) {
      const semua = dapatkanSemuaRute();
      const idx = semua.findIndex(r => r.route === currentRoute);
      if (idx === -1) return '';

      const prev = idx > 0 ? semua[idx - 1] : null;
      const next = idx < semua.length - 1 ? semua[idx + 1] : null;

      return `
        <div class="page-nav">
          ${prev ? `<a href="#${prev.route}"><span>← Sebelumnya</span><strong>${prev.label}</strong></a>` : `<div></div>`}
          ${next ? `<a href="#${next.route}" style="text-align:right;"><span>Berikutnya →</span><strong>${next.label}</strong></a>` : `<div></div>`}
        </div>
      `;
    }

    function renderHalaman() {
      const hash = location.hash.slice(1) || 'pengenalan';
      sidebar.classList.remove('open');
      tandaiMenuAktif();

      // 1. Cek Halaman Khusus
      for (const kat of DOCS_DATA) {
        for (const h of (kat.halamanKhusus || [])) {
          if (h.id === hash) {
            mainContent.innerHTML = h.kontenHTML + buatNavigasiBawah(hash);
            window.scrollTo(0, 0);
            return;
          }
        }
      }

      // 2. Cek Halaman Kategori (#kategori/...)
      if (hash.startsWith('kategori/')) {
        const katId = hash.split('/')[1];
        const kat = DOCS_DATA.find(k => k.id === katId);
        if (kat) {
          const specialCards = (kat.halamanKhusus || []).map(h => `
            <a href="#${h.id}" class="fn-card">
              <div>
                <h3 style="font-family:inherit;">📖 ${h.nama}</h3>
                <p>Panduan pengantar dan cara instalasi dasar GeoSVG.js.</p>
              </div>
            </a>
          `).join('');

          const fnCards = (kat.fungsi || []).map(f => `
            <a href="#fungsi/${f.id}" class="fn-card">
              <div>
                <h3>${f.nama}</h3>
                <p>${f.ringkasan}</p>
              </div>
            </a>
          `).join('');

          mainContent.innerHTML = `
            <a href="#pengenalan" class="breadcrumb">📚 Dokumentasi GeoSVG.js</a>
            <h1>${kat.judul}</h1>
            <p class="lead">${kat.deskripsi}</p>

            <h2>Daftar Halaman & Fungsi (${(kat.fungsi || []).length} Fungsi)</h2>
            <div class="card-grid">
              ${specialCards}
              ${fnCards}
            </div>
            ${buatNavigasiBawah(hash)}
          `;
          window.scrollTo(0, 0);
          return;
        }
      }

      // 3. Cek Halaman Detail Fungsi (#fungsi/...)
      if (hash.startsWith('fungsi/')) {
        const fnId = hash.split('/')[1];
        for (const kat of DOCS_DATA) {
          const fn = (kat.fungsi || []).find(f => f.id === fnId);
          if (fn) {
            tampilkanHalamanFungsi(kat, fn, hash);
            window.scrollTo(0, 0);
            return;
          }
        }
      }

      location.hash = '#pengenalan';
    }

    function tampilkanHalamanFungsi(kat, fn, hash) {
      const barisParam = (fn.parameter && fn.parameter.length > 0)
        ? fn.parameter.map(p => `
            <tr>
              <td><code>${p.nama}</code></td>
              <td><code>${p.tipe}</code></td>
              <td>${p.ket}</td>
            </tr>
          `).join('')
        : `<tr><td colspan="3" style="color:var(--text-muted);">Fungsi ini tidak memerlukan parameter wajib.</td></tr>`;

      const bagianOpsi = (fn.opsi && fn.opsi.length > 0)
        ? `
          <h2>Opsi Konfigurasi (<code>options</code>)</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Nama Opsi</th><th>Tipe</th><th>Nilai Bawaan</th><th>Keterangan</th></tr>
              </thead>
              <tbody>
                ${fn.opsi.map(o => `
                  <tr>
                    <td><code>${o.nama}</code></td>
                    <td><code>${o.tipe}</code></td>
                    <td><code>${o.bawaan}</code></td>
                    <td>${o.ket}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `
        : '';

      mainContent.innerHTML = `
        <a href="#kategori/${kat.id}" class="breadcrumb">← Kategori: ${kat.judul}</a>
        <h1><code>${fn.nama}</code></h1>
        <p class="lead">${fn.ringkasan}</p>

        <h2>Format Kode (Sintaks)</h2>
        <pre><code>${fn.sintaks}</code></pre>

        <h2>Parameter</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Parameter</th><th>Tipe</th><th>Keterangan</th></tr>
            </thead>
            <tbody>${barisParam}</tbody>
          </table>
        </div>

        ${bagianOpsi}

        <h2>Contoh & Hasil Contoh Interaktif</h2>
        <p>Anda dapat mengubah kode di sebelah kiri dan menekan <strong>Jalankan Kode</strong> untuk melihat perubahan hasilnya secara langsung:</p>
        <div class="demo-container">
          <div class="code-editor-panel">
            <div class="panel-toolbar">
              <span>KODE CONTOH JAVASCRIPT</span>
              <div class="toolbar-actions">
                <button class="btn-small" id="btnCopyCode">Salin Kode</button>
                <button class="btn-small" id="btnResetCode">Reset</button>
                <button class="btn-small primary" id="btnRunCode">▶ Jalankan Kode</button>
              </div>
            </div>
            <textarea id="liveCodeEditor" class="code-textarea" spellcheck="false"></textarea>
          </div>

          <div class="preview-panel">
            <div class="preview-header">
              <span>HASIL CONTOH (LIVE SVG)</span>
              <button class="btn-small" id="btnDownloadDemoSVG" style="background:#e2e8f0;color:#0f172a;">Unduh SVG</button>
            </div>
            <div class="preview-canvas">
              <div id="livePreviewContainer"></div>
              <div id="liveConsoleOutput" class="console-output" style="display:none;"></div>
            </div>
          </div>
        </div>

        ${buatNavigasiBawah(hash)}
      `;

      const editor = document.getElementById('liveCodeEditor');
      const previewContainer = document.getElementById('livePreviewContainer');
      const consoleBox = document.getElementById('liveConsoleOutput');
      editor.value = fn.contohKode;

      function jalankanKode() {
        previewContainer.innerHTML = '';
        consoleBox.style.display = 'none';
        try {
          const runner = new Function('container', editor.value);
          const hasilReturn = runner(previewContainer);
          if (hasilReturn !== undefined) {
            consoleBox.style.display = 'block';
            consoleBox.textContent = '💡 Output: ' + hasilReturn;
          }
        } catch (err) {
          consoleBox.style.display = 'block';
          consoleBox.style.color = '#dc2626';
          consoleBox.textContent = '⚠️ Error: ' + err.message;
        }
      }

      document.getElementById('btnRunCode').addEventListener('click', jalankanKode);
      document.getElementById('btnResetCode').addEventListener('click', () => {
        editor.value = fn.contohKode;
        jalankanKode();
      });
      document.getElementById('btnCopyCode').addEventListener('click', (e) => {
        navigator.clipboard.writeText(editor.value);
        e.target.textContent = '✓ Tersalin!';
        setTimeout(() => { e.target.textContent = 'Salin Kode'; }, 1500);
      });
      document.getElementById('btnDownloadDemoSVG').addEventListener('click', () => {
        const svgEl = previewContainer.querySelector('svg');
        if (!svgEl) return;
        const xml = '<?xml version="1.0" standalone="no"?>\r\n' + new XMLSerializer().serializeToString(svgEl);
        const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `contoh-${fn.id}.svg`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

      jalankanKode();
    }

    searchInput.addEventListener('input', e => renderSidebar(e.target.value));
    window.addEventListener('hashchange', renderHalaman);

    // Inisialisasi saat halaman pertama kali dibuka
    renderSidebar();
    renderHalaman();
  </script>
</body>
